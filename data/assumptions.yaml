  capacity_headroom:
    value: 1.15
    unit: plant capacity = share x national volume x headroom
  list:
    - {id: P_HDW, name: "Haridwar (Uttarakhand)",  lat: 29.945, lon: 78.164, state: Uttarakhand, share: 0.40}
    - {id: P_SLV, name: "Silvassa (DNH)",          lat: 20.274, lon: 73.008, state: "Dadra and Nagar Haveli and Daman and Diu", share: 0.35}
