# ---------------------------------------------------------------------
# 9. As-is network (hypothetical pre-GST style: one C&F depot per state
#    or state group, Grade B space). Used for the "savings vs today" story.
# ---------------------------------------------------------------------
as_is_depots:
  note: >
    Zones are served by the depot of their own state; states not listed map
    to the nearest depot. Rent = nearest candidate cluster rent x (1 - grade_b
    discount) where one exists in the same metro, else default_rent.
    `state` is the depot's own state (North-East routing, spec §5);
    `metro_group` matches the candidate groups and defines "same metro".
  default_rent:
    value: 17
    unit: INR / sq ft / month (Grade B, used as is; no further discount)
    source: Analyst assumption (spec §8); applies to depots with no candidate cluster in their metro (Ludhiana)
    confidence: low
  list:
    - {id: AS_MUM, name: Bhiwandi,    lat: 19.296, lon: 73.063, state: Maharashtra, metro_group: MUM, states: [Maharashtra, Goa]}
